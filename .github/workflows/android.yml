# Baut die Android-App (APK) auf GitHub – auf dem eigenen PC muss nichts installiert werden.
# Start: Reiter „Actions“ → „Android-App bauen“ → „Run workflow“. Ergebnis unten unter „Artifacts“.
#
# Signieren (damit Updates sich über die alte Version installieren lassen):
# Unter Settings → Secrets and variables → Actions diese Secrets anlegen (Anleitung: docs/APP-BAUEN.md):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORT, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORT
# Ohne Secrets entsteht eine Test-APK (Debug), die man vor jedem Update deinstallieren muss.
name: Android-App bauen

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
          # Eigener Baustein für den Druckdialog (PDF-Bericht)
          ZIEL=$(dirname "$(find android/app/src/main/java -name MainActivity.java | head -1)")
          echo "MainActivity in: $ZIEL"
          cp native/android/*.java "$ZIEL/"
          # Keine automatische Google-Drive-Sicherung des Tagebuchs (Daten bleiben nur auf dem Handy)
          M=android/app/src/main/AndroidManifest.xml
          if grep -q 'android:allowBackup=' "$M"; then
            sed -i 's/android:allowBackup="[a-z]*"/android:allowBackup="false"/' "$M"
          else
            sed -i 's/<application/<application android:allowBackup="false"/' "$M"
          fi
          grep -n 'allowBackup' "$M"
          # Versionsnummer hochzählen, damit Updates erkannt werden
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Signierte APK bauen
        if: ${{ env.KS != '' }}
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORT }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORT }}
        run: |
          echo "$KS" | base64 -d > release.keystore
          cd android && ./gradlew --no-daemon assembleRelease && cd ..
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk ausgerichtet.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out DBT-Tagebuch.apk ausgerichtet.apk
          rm release.keystore

      - name: Test-APK bauen (ohne Signatur-Secrets)
        if: ${{ env.KS == '' }}
        run: |
          cd android && ./gradlew --no-daemon assembleDebug && cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk DBT-Tagebuch-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DBT-Tagebuch-APK
          path: DBT-Tagebuch*.apk
          retention-days: 30
