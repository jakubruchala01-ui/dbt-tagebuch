<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4F7A6A">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
  <title>DBT-Tagebuch</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="bericht.css">
  <script type="module" src="js/design.js"></script>
</head>
<body>
  <header>
    <div class="kopf-innen">
      <div class="kopfzeile">
        <h1>DBT-Tagebuch</h1>
        <span class="speicherstatus" id="speicherstatus" aria-live="polite"></span>
        <button id="hilfe-btn" class="hilfe-knopf" title="Hilfe zu dieser Seite" aria-label="Hilfe zu dieser Seite">?</button>
        <button id="merken-btn" class="merken" title="Für die nächste Therapiestunde merken" aria-label="Für die nächste Therapiestunde merken"></button>
        <button id="notfall-btn" class="herz" title="Hilfe in der Krise" aria-label="Hilfe in der Krise"></button>
      </div>
      <nav aria-label="Hauptnavigation">
        <button data-view="woche" data-icon="woche" class="active">Woche</button>
        <button data-view="heute" data-icon="karte">Karte</button>
        <button data-view="ketten" data-icon="ketten">Ketten</button>
        <button data-view="verlauf" data-icon="verlauf" class="nur-breit">Verlauf</button>
        <button data-view="pdf" data-icon="pdf">PDF</button>
        <button data-view="mehr" data-icon="mehr">Mehr</button>
      </nav>
    </div>
  </header>
  <main id="main"><p class="meta">Lädt …</p></main>
  <div id="druck" hidden></div>
  <div id="modal" hidden></div>
  <div id="sperre" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
